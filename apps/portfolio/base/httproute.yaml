apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: web
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: default

  # Apex only. If you also want www.good-robert.com, add it here and serve a
  # redirect rather than the site itself, so the canonical URL stays single.
  hostnames:
    - good-robert.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: portfolio
          port: 80
