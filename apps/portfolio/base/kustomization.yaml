apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

# includeSelectors: false on purpose — a Deployment's selector is immutable
# once created, so labels that may change must never leak into it.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: portfolio
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - pdb.yaml
  - networkpolicy.yaml
