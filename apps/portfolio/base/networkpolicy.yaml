# Default deny for the whole namespace: nothing talks to these pods, and these
# pods talk to nothing, unless a policy below says otherwise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/name: portfolio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio-allow-gateway
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    # Only the Envoy Gateway data-plane proxies may reach the app port. Envoy
    # Gateway runs the generated proxy Deployment in the same namespace as its
    # controller, which is envoy-gateway-system in a default install. Confirm
    # yours before trusting this:
    #   kubectl get pods -A -l app.kubernetes.io/name=envoy -o wide
    # If the proxies live somewhere else, change the namespace name here or
    # the site answers 503 with no pod ever being reached.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio-allow-dns
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio
      app.kubernetes.io/component: web
  policyTypes:
    - Egress
  egress:
    # DNS only. The server renders from data baked into the image and calls no
    # outbound service; fonts are fetched by the visitor's browser, not by the
    # pod. If that ever changes, add an explicit rule rather than widening this.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
