apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: production

images:
  # Pinned on purpose: a floating tag makes "what is running" unanswerable and
  # a rollback impossible.
  #
  # This is the image limitedbug/portfolio's release workflow actually
  # publishes (IMAGE_NAME is github.repository). Note that its `pin` job still
  # rewrites deploy/k8s/overlays/production/kustomization.yaml *inside that
  # repo*, which is no longer what the cluster reads — see the repo README.
  - name: ghcr.io/limitedbug/portfolio
    newTag: v1.0.0
