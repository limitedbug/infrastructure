# Production carries more headroom than the base default and keeps two pods up
# through a node drain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio
spec:
  minReplicas: 3
  maxReplicas: 12
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portfolio
spec:
  minAvailable: 2
