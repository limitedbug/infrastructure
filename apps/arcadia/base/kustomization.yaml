apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arcadia

# includeSelectors: false on purpose — a Deployment's selector is immutable
# once created, so labels that may change must never leak into it.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: arcadia
      app.kubernetes.io/managed-by: kustomize

# secret.example.yaml is intentionally absent: it is a template, not a
# resource. See the header of that file.
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
