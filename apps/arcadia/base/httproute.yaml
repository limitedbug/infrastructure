apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arcadia
  labels:
    app.kubernetes.io/name: arcadia
    app.kubernetes.io/component: web
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: default

  hostnames:
    - arcadia.good-robert.com

  # Socket.IO holds a request open for its whole long-polling interval (~25s
  # by default) and then upgrades to a WebSocket that stays open for the
  # session. Envoy's default route timeout is 15s, which would cut both off.
  # A zero-valued timeout disables it, which is what a persistent connection
  # needs; the app's own ping/timeout settings are what detect a dead peer.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      timeouts:
        request: 0s
        backendRequest: 0s

      backendRefs:
        - name: arcadia
          port: 80
