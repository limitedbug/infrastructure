# TEMPLATE ONLY — this file is deliberately NOT listed in kustomization.yaml,
# so ArgoCD never applies it and never sees these placeholder values.
#
# Real secrets do not belong in this repository. Create them directly against
# the cluster, once:
#
#   kubectl create secret generic arcadia-secrets \
#     --namespace arcadia \
#     --from-literal=MONGODB_URI='mongodb+srv://user:pass@host/arcadia' \
#     --from-literal=NEXTAUTH_SECRET="$(openssl rand -base64 32)"
#
# Add --from-literal for the OAuth pairs below only if you actually use those
# providers. The Deployment reads this Secret through envFrom.secretRef, so
# the pod will stay in CreateContainerConfigError until it exists.
#
# ArgoCD will not prune or overwrite it: the Secret is not tracked by any
# Application, and the production AppProject does not whitelist Secret as a
# managed resource, on purpose.
#
# For anything beyond a single VPS, prefer sealed-secrets or the External
# Secrets Operator over a hand-applied Secret.
apiVersion: v1
kind: Secret
metadata:
  name: arcadia-secrets
  namespace: arcadia
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://user:password@host/arcadia?retryWrites=true&w=majority"
  # Generate with: openssl rand -base64 32
  NEXTAUTH_SECRET: "REPLACE_ME"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
