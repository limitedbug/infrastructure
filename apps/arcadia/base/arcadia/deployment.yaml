apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcadia
  labels:
    app: arcadia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arcadia
  template:
    metadata:
      labels:
        app: arcadia
    spec:
      imagePullSecrets:
        - name: ghcr-credentials 
      terminationGracePeriodSeconds: 30
      containers:
        - name: arcadia
          image: ghcr.io/limitedbug/arcadia:v1.0.0
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: arcadia-config
            - secretRef:
                name: arcadia-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
