name: Reusable Release

on:
  workflow_call:
    inputs:
      verify_command:
        description: Command used to verify the application before publishing.
        required: true
        type: string

      bun_version:
        description: Optional Bun version. Leave empty when Bun is not used.
        required: false
        default: ""
        type: string

      node_version:
        description: Optional Node.js version. Leave empty when Node.js is not used.
        required: false
        default: ""
        type: string

      infrastructure_path:
        description: Path to the production Kustomize overlay.
        required: true
        type: string

      image_name:
        description: Full GHCR image name.
        required: true
        type: string

    secrets:
      INFRASTRUCTURE_TOKEN:
        description: Token with write access to the infrastructure repository.
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Bun
        if: inputs.bun_version != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Setup Node.js
        if: inputs.node_version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install Bun dependencies
        if: inputs.bun_version != ''
        run: bun install --frozen-lockfile

      - name: Install Node.js dependencies
        if: inputs.node_version != ''
        run: npm ci

      - name: Verify application
        run: ${{ inputs.verify_command }}

  publish:
    name: Build, scan and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: candidate:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan candidate image
        run: |
          set -euo pipefail

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              candidate:scan

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ inputs.image_name }}:${{ github.ref_name }}
            ${{ inputs.image_name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          cosign sign --yes \
            "${{ inputs.image_name }}@${DIGEST}"

  pin:
    name: Pin production in infrastructure
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: limitedbug/infrastructure
          ref: main
          token: ${{ secrets.INFRASTRUCTURE_TOKEN }}
          path: infrastructure

      - name: Install Kustomize
        run: |
          set -euo pipefail

          curl -sSLo kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"

          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Pin production to published digest
        working-directory: infrastructure/${{ inputs.infrastructure_path }}
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail

          kustomize edit set image \
            "${{ inputs.image_name }}=${{ inputs.image_name }}@${DIGEST}"

          echo "=== Production kustomization ==="
          cat kustomization.yaml

      - name: Commit and push infrastructure change
        working-directory: infrastructure
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Production already points at this digest."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ inputs.infrastructure_path }}/kustomization.yaml"

          git commit \
            -m "chore(${{ github.event.repository.name }}): deploy ${RELEASE_TAG}"

          git push origin main
