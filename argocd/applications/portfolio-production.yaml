apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-production
  namespace: argocd
spec:
  project: production
  source:
    repoURL: https://github.com/limitedbug/infrastructure.git
    targetRevision: main
    path: apps/portfolio/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
