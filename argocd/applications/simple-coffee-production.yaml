apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-coffee-production
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/limitedbug/infrastructure.git
    targetRevision: main
    path: apps/simple-coffee/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: simple-coffee

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
