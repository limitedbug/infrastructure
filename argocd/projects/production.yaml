apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: production
  namespace: argocd
spec:
  description: Production workloads managed by GitOps

  sourceRepos:
    - https://github.com/limitedbug/infrastructure.git

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc

    - namespace: simple-coffee
      server: https://kubernetes.default.svc

    - namespace: default
      server: https://kubernetes.default.svc

    - namespace: arcadia
      server: https://kubernetes.default.svc

    - namespace: portfolio
      server: https://kubernetes.default.svc

    - namespace: quality-clean
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: gateway.networking.k8s.io
      kind: GatewayClass

    # Each app owns its namespace as a manifest, so the namespace is created
    # and labelled (Pod Security admission) by the same sync that deploys into
    # it, instead of existing as undocumented cluster state.
    - group: ""
      kind: Namespace

  # Anything not listed here is refused at sync time, so adding a new kind of
  # resource is a deliberate edit to this file rather than a surprise.
  #
  # Secret is deliberately absent: secrets are created out of band against the
  # cluster and must never be reconciled from Git.
  namespaceResourceWhitelist:
    - group: gateway.networking.k8s.io
      kind: Gateway

    - group: gateway.networking.k8s.io
      kind: HTTPRoute

    - group: argoproj.io
      kind: Application

    - group: ""
      kind: ConfigMap

    - group: ""
      kind: Service

    - group: ""
      kind: ServiceAccount

    - group: apps
      kind: Deployment

    - group: policy
      kind: PodDisruptionBudget

    - group: networking.k8s.io
      kind: NetworkPolicy
